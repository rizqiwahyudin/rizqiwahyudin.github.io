<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transit // city explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a12;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;

        }

        canvas {

            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: block;
        }

        /* Top bar */
        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: rgba(10, 10, 18, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            z-index: 20;
        }

        #title {
            font-size: 13px;
            font-variant: small-caps;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.28);
            flex: 0 0 auto;
            min-width: 90px;
        }

        #search-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;

        #city-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.14);

        }

            border-color: rgba(0, 255, 255, 0.35);
        }

        #load-btn {
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 4px;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;

            text-transform: lowercase;
            transition: background 0.15s, border-color 0.15s;

        #load-btn:hover {

            border-color: rgba(0, 255, 255, 0.55);

        #transit-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.30);
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 6px 14px;
            cursor: pointer;
            text-transform: lowercase;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            flex: 0 0 auto;
        }

        #transit-btn:hover:not(:disabled) {

        #transit-btn.active {

        #aircraft-btn {

            border-radius: 4px;

            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 2px;

        }
        #aircraft-btn:hover:not(:disabled) {

            border-color: rgba(0, 255, 255, 0.25);
            color: rgba(0, 255, 255, 0.60);
        }
        #aircraft-btn.active {
            background: rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.55);

        }

        #hud {
            font-size: 11px;

        /* Bottom-left status line */

    </style>
</head>
<body>

    <!-- Top bar -->
    <div id="topbar">
        <div id="title">transit</div>

        <div id="search-group">
            <input id="city-input" type="text" placeholder="enter a city..." autocomplete="off" spellcheck="false" />
            <button id="load-btn">load</button>
        </div>

        <button id="transit-btn" disabled>metro</button>
        <button id="aircraft-btn" disabled>aircraft</button>

        <div id="hud"></div>
    </div>

    <!-- Status line -->
    <div id="status"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

    <script>
'use strict';

// ─── Constants ────────────────────────────────────────────────────────────────

const OVERPASS_MIRRORS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
    'https://overpass.openstreetmap.ru/api/interpreter',
];

const CHUNK_SIZE = 5000;        // buildings per animation frame during build
const MAX_BBOX_DIAG_M = 120000; // clamp large cities to this diagonal
const CLAMP_DIAG_M = 80000;     // target diagonal when clamping
const HEIGHT_EXAGGERATION = 6;  // vertical scale multiplier so skylines read at city scale
const GROUND_GRID_SPACING = 18; // world units between ground points (tuned after city loads)

// ─── State ────────────────────────────────────────────────────────────────────

let scene, camera, renderer, controls, composer;
let buildingLines = null;      // current THREE.LineSegments
let buildingLineMaterial = null;
let aspect = window.innerWidth / window.innerHeight;

// coordinate system origin, set per city load
let originLat = 0;
let originLon = 0;
let worldScale = 1;

// overpass mirror rotation
let _overpassIdx = 0;

// height distribution percentiles, computed per city load so color range fits local context
let _heightP5  = 0;
let _heightP95 = 80;

// ground plane
let groundPoints   = null;  // THREE.Points for the animated ground grid
let groundMaterial = null;
let _groundOrigY   = null;  // Float32Array of base Y values for wave animation
let _groundTime    = 0;     // animation clock in seconds

// chunked build state
let _buildChunks = [];         // array of way elements
let _buildChunkIdx = 0;
let _buildPositions = [];      // accumulated line vertex data
let _buildColors = [];
let _buildNodes = {};          // node id -> {lat, lon}
let _buildTotal = 0;
let _isBuildingChunks = false;
let _minX = Infinity, _maxX = -Infinity, _minZ = Infinity, _maxZ = -Infinity, _maxY = 0;

// ─── Transit state ────────────────────────────────────────────────────────────

let _cityBbox      = null;   // {south, west, north, east} set after successful city load
let _transitActive = false;
let _transitTimer  = null;
let _vehicles      = new Map();
let _vehicleCount  = 0;
let _metroLines    = [];     // THREE.Line objects for metro route shapes
let _metroShapes   = null;   // cached shapes from first metro poll

let _aircraftActive = false;
let _aircraftTimer  = null;
let _aircraftPoints = null;   // single THREE.Points rebuilt each poll
let _aircraftCount  = 0;

const TRANSIT_POLL_MS  = 15000;
const AIRCRAFT_POLL_MS = 10000;
const CROSS_ARM        = 8;
const CROSS_Y          = 2;

const METRO_PROXY_URL = 'https://composer-immediate-twist-decisions.trycloudflare.com/gtfs-rt/metro.json';

const LINE_COLORS = {
    blue:  [0.2, 0.4, 1.0],
    red:   [1.0, 0.2, 0.2],
    green: [0.2, 0.85, 0.3],
};

// ─── DOM refs ─────────────────────────────────────────────────────────────────

const hudEl      = document.getElementById('hud');
const statusEl   = document.getElementById('status');
const inputEl    = document.getElementById('city-input');
const loadBtn    = document.getElementById('load-btn');
const transitBtn  = document.getElementById('transit-btn');
const aircraftBtn = document.getElementById('aircraft-btn');

// ─── Scene setup ─────────────────────────────────────────────────────────────

function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.00018); // gentle depth fade

    camera = new THREE.PerspectiveCamera(45, aspect, 1, 200000);
    camera.position.set(0, 1800, 1800);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;
    controls.minDistance = 10;
    controls.maxDistance = 50000;

    // Post-processing bloom
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.5,  // strength
        0.3,  // radius
        0.0   // threshold -- glow everything
    );
    composer.addPass(bloomPass);

    window.addEventListener('resize', onResize);
}

function onResize() {
    aspect = window.innerWidth / window.innerHeight;
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
}

// ─── Coordinate system ───────────────────────────────────────────────────────

function haversineM(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2
        + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
        * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function latLonToWorld(lat, lon) {
    const dLon = (lon - originLon) * Math.PI / 180;
    const dLat = (lat - originLat) * Math.PI / 180;
    const x = dLon * Math.cos(originLat * Math.PI / 180) * 6371000 * worldScale;
    const z = -dLat * 6371000 * worldScale;
    return { x, z };
}

// ─── Color mapping ────────────────────────────────────────────────────────────

// Matches citywatch.html heightColor: dark blue-teal at base, full #33ccff at top.
// verticalT: 0 (base) to 1 (top)
function columnColor(normalizedH, verticalT) {
    const t = verticalT;
    const r = 0.1 + t * 0.1;
    const g = 0.5 + t * 0.3;
    const b = 0.8 + t * 0.2;
    return [r, g, b];
}

// ─── Data pipeline ───────────────────────────────────────────────────────────

function nextOverpassURL() {
    return OVERPASS_MIRRORS[(_overpassIdx++) % OVERPASS_MIRRORS.length];
}

async function geocodeCity(query) {
    const url = 'https://nominatim.openstreetmap.org/search?'
        + new URLSearchParams({
            q: query,
            format: 'json',
            limit: '1',
            featuretype: 'city',
        });

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);

    const res = await fetch(url, {
        signal: ctrl.signal,
        headers: {
            'User-Agent': 'transit-explorer/1.0',
            'Accept-Language': 'en',
        },
    });
    clearTimeout(timer);

    if (!res.ok) throw new Error('Nominatim returned ' + res.status);

    const data = await res.json();
    if (!data.length) throw new Error('city not found');

    const item = data[0];
    const bb = item.boundingbox; // [south, north, west, east]
    let south = parseFloat(bb[0]);
    let north = parseFloat(bb[1]);
    let west  = parseFloat(bb[2]);
    let east  = parseFloat(bb[3]);
    const lat = parseFloat(item.lat);
    const lon = parseFloat(item.lon);
    let displayName = item.display_name;

    // clamp oversized bounding boxes (avoids massive overpass queries)
    const diagM = haversineM(south, west, north, east);
    if (diagM > MAX_BBOX_DIAG_M) {
        const ratio = CLAMP_DIAG_M / diagM;
        const dLat = (north - south) * ratio / 2;
        const dLon = (east - west) * ratio / 2;
        const centerLat = (south + north) / 2;
        const centerLon = (west + east) / 2;
        south = centerLat - dLat;
        north = centerLat + dLat;
        west  = centerLon - dLon;
        east  = centerLon + dLon;
        displayName += ' (central area)';
    }

    return { lat, lon, south, north, west, east, displayName };
}

async function fetchBuildings(south, north, west, east) {
    const query = `[out:json][timeout:60];
(
  way["building"](${south},${west},${north},${east});
);
out body;>;out skel qt;`;

    const encoded = 'data=' + encodeURIComponent(query);

    // try each mirror until one responds
    for (let attempt = 0; attempt < OVERPASS_MIRRORS.length; attempt++) {
        const url = nextOverpassURL();
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 75000);

        try {
            const res = await fetch(url, {
                method: 'POST',
                body: encoded,
                signal: ctrl.signal,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            });
            clearTimeout(timer);

            if (!res.ok) {
                setStatus('mirror ' + url.split('/')[2] + ' failed (' + res.status + '), trying next...');
                continue;
            }

            const data = await res.json();
            return data.elements || [];

        } catch (err) {
            clearTimeout(timer);
            setStatus('mirror ' + url.split('/')[2] + ' unreachable, trying next...');
        }
    }

    throw new Error('all overpass mirrors failed');
}

// ─── Geometry ────────────────────────────────────────────────────────────────

function clearPointCloud() {
    if (buildingLines) {
        scene.remove(buildingLines);
        buildingLines.geometry.dispose();
        if (buildingLineMaterial) buildingLineMaterial.dispose();
        buildingLines = null;
        buildingLineMaterial = null;
    }
    // Clear ground plane on city reset so stale geometry doesn't bleed into the next load
    if (groundPoints) {
        scene.remove(groundPoints);
        groundPoints.geometry.dispose();
        groundMaterial.dispose();
        groundPoints   = null;
        groundMaterial = null;
        _groundOrigY   = null;
        _groundTime    = 0;
    }
}

function resetBuildState() {
    _buildChunks = [];
    _buildChunkIdx = 0;
    _buildPositions = [];
    _buildColors = [];
    _buildNodes = {};
    _buildTotal = 0;
    _isBuildingChunks = false;
    _minX = Infinity; _maxX = -Infinity;
    _minZ = Infinity; _maxZ = -Infinity;
    _maxY = 0;
}

// split way elements into fixed-size chunks for frame-paced processing
function chunkElements(ways) {
    const chunks = [];
    for (let i = 0; i < ways.length; i += CHUNK_SIZE) {
        chunks.push(ways.slice(i, i + CHUNK_SIZE));
    }
    return chunks;
}

function processChunk(chunk) {
    for (const el of chunk) {
        if (el.type !== 'way' || !el.tags || !el.tags.building) continue;
        if (!el.nodes || el.nodes.length < 3) continue;

        // Build footprint in world coords
        const footprint = [];
        for (const nid of el.nodes) {
            const nd = _buildNodes[nid];
            if (!nd) continue;
            footprint.push(latLonToWorld(nd.lat, nd.lon));
        }
        if (footprint.length < 3) continue;

        const levels = parseInt(el.tags['building:levels'], 10);
        const heightM = (isFinite(levels) && levels > 0) ? levels * 3.5 : 8;
        const normalizedH = _heightP95 > _heightP5
            ? Math.max(0, Math.min(1, (heightM - _heightP5) / (_heightP95 - _heightP5)))
            : 0.5;

        const h = heightM * worldScale * HEIGHT_EXAGGERATION;
        const [rb, gb, bb] = columnColor(normalizedH, 0.0); // base color
        const [rt, gt, bt] = columnColor(normalizedH, 1.0); // top color

        // Roof loop + base loop + vertical lines along each wall
        const WIRE_SPACING = 3.0; // world units between vertical wires along each edge
        for (let i = 0; i < footprint.length - 1; i++) {
            const a = footprint[i];
            const b = footprint[i + 1];

            // Roof edge
            _buildPositions.push(a.x, h, a.z,  b.x, h, b.z);
            _buildColors.push(rt, gt, bt,  rt, gt, bt);

            // Base edge
            _buildPositions.push(a.x, 0, a.z,  b.x, 0, b.z);
            _buildColors.push(rb, gb, bb,  rb, gb, bb);

            // Vertical lines: corner + intermediates spaced every WIRE_SPACING units
            const edgeLen = Math.hypot(b.x - a.x, b.z - a.z);
            const numWires = Math.max(1, Math.ceil(edgeLen / WIRE_SPACING));
            for (let w = 0; w < numWires; w++) {
                const t = w / numWires;
                const wx = a.x + t * (b.x - a.x);
                const wz = a.z + t * (b.z - a.z);
                _buildPositions.push(wx, 0, wz,  wx, h, wz);
                _buildColors.push(rb, gb, bb,  rt, gt, bt);
            }

            // Track bounds
            if (a.x < _minX) _minX = a.x; if (a.x > _maxX) _maxX = a.x;
            if (a.z < _minZ) _minZ = a.z; if (a.z > _maxZ) _maxZ = a.z;
        }
        if (h > _maxY) _maxY = h;
    }
}

function finalizePointCloud(cityName, totalBuildings) {
    const positions = new Float32Array(_buildPositions);
    const colors    = new Float32Array(_buildColors);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

    buildingLineMaterial = new THREE.LineBasicMaterial({ vertexColors: true });

    buildingLines = new THREE.LineSegments(geo, buildingLineMaterial);
    scene.add(buildingLines);

    fitCamera();
    buildGroundPlane(_minX, _maxX, _minZ, _maxZ);
    hudEl.dataset.buildings = totalBuildings.toLocaleString();
    hudEl.dataset.cityName  = escapeHtml(cityName);
    updateHud();
    setStatus('');
    loadBtn.disabled = false;
}

function buildGroundPlane(minX, maxX, minZ, maxZ) {
    // Always rebuild fresh; clearPointCloud already disposed the old one
    if (groundPoints) {
        scene.remove(groundPoints);
        groundPoints.geometry.dispose();
        groundMaterial.dispose();
        groundPoints   = null;
        groundMaterial = null;
        _groundOrigY   = null;
    }

    // Expand slightly beyond city bounds so ground covers edges of the point cloud
    const pad = (maxX - minX) * 0.05;
    const x0 = minX - pad, x1 = maxX + pad;
    const z0 = minZ - pad, z1 = maxZ + pad;

    // Fixed grid resolution so the ground looks consistent regardless of city size
    const cols = 220;
    const rows = 220;
    const dx = (x1 - x0) / cols;
    const dz = (z1 - z0) / rows;

    const count     = cols * rows;
    const positions = new Float32Array(count * 3);
    const colors    = new Float32Array(count * 3);
    _groundOrigY    = new Float32Array(count);

    let i = 0;
    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            // Slight jitter breaks the visible grid regularity at distance
            const x = x0 + col * dx + (Math.random() - 0.5) * dx * 0.4;
            const z = z0 + row * dz + (Math.random() - 0.5) * dz * 0.4;
            positions[i * 3]     = x;
            positions[i * 3 + 1] = 0;
            positions[i * 3 + 2] = z;
            _groundOrigY[i] = 0;

            // Dim teal-grey, consistent (wave will modulate this each frame)
            colors[i * 3]     = 0.04;
            colors[i * 3 + 1] = 0.12;
            colors[i * 3 + 2] = 0.16;
            i++;
        }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

    groundMaterial = new THREE.PointsMaterial({
        size: 0.8,
        sizeAttenuation: true,
        vertexColors: true,
    });

    groundPoints = new THREE.Points(geo, groundMaterial);
    groundPoints.renderOrder = -1; // draw before buildings so buildings sit on top
    scene.add(groundPoints);
}

function fitCamera() {
    if (!isFinite(_minX) || !isFinite(_maxX)) return;

    // Pull camera back far enough that the whole city fits in a 45-degree FOV.
    // Use the larger of width or depth as the bounding radius, then add height
    // offset so we're looking down at roughly 40 degrees.
    const citySpan = Math.max(_maxX - _minX, _maxZ - _minZ);
    const cityRadius = citySpan / 2;
    const dist = cityRadius / Math.tan((45 / 2) * Math.PI / 180) * 1.1;

    const centerX = (_minX + _maxX) / 2;
    const centerZ = (_minZ + _maxZ) / 2;

    controls.target.set(centerX, 0, centerZ);
    camera.position.set(centerX, dist * 0.75, centerZ + dist * 0.75);
    camera.lookAt(centerX, 0, centerZ);
    camera.updateProjectionMatrix();
    controls.update();
}

// ─── Chunked build loop ───────────────────────────────────────────────────────

// called from the animation loop one chunk per frame
function tickBuildChunks(cityName) {
    if (!_isBuildingChunks) return;
    if (_buildChunkIdx >= _buildChunks.length) {
        _isBuildingChunks = false;
        finalizePointCloud(cityName, _buildTotal);
        return;
    }

    processChunk(_buildChunks[_buildChunkIdx]);
    _buildChunkIdx++;

    const done = Math.min(_buildChunkIdx * CHUNK_SIZE, _buildTotal);
    setStatus('rendering ' + done.toLocaleString() + ' / ' + _buildTotal.toLocaleString() + '...');
}

// ─── Load orchestrator ────────────────────────────────────────────────────────

// pendingCityName is shared so the animation loop can pass it to finalizePointCloud
let _pendingCityName = '';

async function loadCity(query) {
    loadBtn.disabled = true;
    stopTransit();
    stopAircraft();
    transitBtn.disabled = true;
    transitBtn.classList.remove('active');
    aircraftBtn.disabled = true;
    aircraftBtn.classList.remove('active');
    _cityBbox = null;
    clearPointCloud();
    resetBuildState();
    hudEl.textContent = '';
    hudEl.dataset.buildings = '';
    hudEl.dataset.cityName  = '';
    statusEl.className = '';

    try {
        setStatus('geocoding...');
        const cityGeo = await geocodeCity(query);

        _cityBbox = { south: cityGeo.south, west: cityGeo.west, north: cityGeo.north, east: cityGeo.east };
        transitBtn.disabled = false;
        aircraftBtn.disabled = false;

        originLat = cityGeo.lat;
        originLon = cityGeo.lon;
        const diagM = haversineM(cityGeo.south, cityGeo.west, cityGeo.north, cityGeo.east);
        worldScale = 2000 / diagM;

        setStatus('fetching buildings...');
        const elements = await fetchBuildings(cityGeo.south, cityGeo.north, cityGeo.west, cityGeo.east);

        if (!elements.length) {
            setStatus('no buildings found for this area');
            loadBtn.disabled = false;
            return;
        }

        // Index nodes, separate ways
        for (const el of elements) {
            if (el.type === 'node') _buildNodes[el.id] = { lat: el.lat, lon: el.lon };
        }
        const ways = elements.filter(el => el.type === 'way' && el.tags && el.tags.building);

        _buildTotal = ways.length;
        _pendingCityName = cityGeo.displayName;

        // Compute height distribution before chunking so processChunk can normalize colors
        const allHeights = ways.map(el => {
            const levels = parseInt(el.tags && el.tags['building:levels'], 10);
            return (isFinite(levels) && levels > 0) ? levels * 3.5 : 8;
        });
        allHeights.sort((a, b) => a - b);
        _heightP5  = allHeights[Math.floor(allHeights.length * 0.05)];
        _heightP95 = allHeights[Math.floor(allHeights.length * 0.95)];

        if (ways.length <= CHUNK_SIZE) {
            processChunk(ways);
            finalizePointCloud(cityGeo.displayName, _buildTotal);
            loadBtn.disabled = false;
        } else {
            _buildChunks = chunkElements(ways);
            _buildChunkIdx = 0;
            _isBuildingChunks = true;
            setStatus('rendering 0 / ' + _buildTotal.toLocaleString() + '...');
        }

    } catch (err) {
        statusEl.className = 'error';
        setStatus('error: ' + err.message);
        loadBtn.disabled = false;
    }
}

// ─── Transit layer (Stockholm Metro) ──────────────────────────────────────────

// Single batched Points object for all metro vehicles
let _metroBatch     = null;  // THREE.Points
let _metroBatchMat  = null;
let _metroMaxSlots  = 200;   // pre-allocate slots
let _metroSlotMap   = new Map(); // vehicle id -> slot index

function ensureMetroBatch() {
    if (_metroBatch) return;
    const pos = new Float32Array(_metroMaxSlots * 3);
    const col = new Float32Array(_metroMaxSlots * 3);
    // Hide all slots off-screen initially
    for (let i = 0; i < _metroMaxSlots; i++) {
        pos[i * 3] = 0; pos[i * 3 + 1] = -9999; pos[i * 3 + 2] = 0;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
    geo.setDrawRange(0, 0);
    _metroBatchMat = new THREE.PointsMaterial({ size: 10, sizeAttenuation: true, vertexColors: true });
    _metroBatch = new THREE.Points(geo, _metroBatchMat);
    scene.add(_metroBatch);
}

function disposeVehicle(entry) {} // no-op, batch handles it

function disposeAllVehicles() {
    _vehicles.clear();
    _metroSlotMap.clear();
    _vehicleCount = 0;
    if (_metroBatch) {
        scene.remove(_metroBatch);
        _metroBatch.geometry.dispose();
        _metroBatchMat.dispose();
        _metroBatch = null;
        _metroBatchMat = null;
    }
}

function disposeMetroLines() {
    for (const line of _metroLines) {
        scene.remove(line);
        line.geometry.dispose();
        line.material.dispose();
    }
    _metroLines = [];
}

function buildMetroLineGeometry(shapes) {
    disposeMetroLines();
    for (const [lineNum, info] of Object.entries(shapes)) {
        const color = LINE_COLORS[info.color] || [0.5, 0.5, 0.5];
        const pts = info.points;
        if (!pts || pts.length < 2) continue;

        const positions = [];
        for (const [lat, lon] of pts) {
            const w = latLonToWorld(lat, lon);
            positions.push(w.x, 0.5, w.z);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const mat = new THREE.LineBasicMaterial({
            color: new THREE.Color(color[0], color[1], color[2]),
            transparent: true,
            opacity: 0.35,
            linewidth: 1,
        });
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        _metroLines.push(line);
    }
}

async function pollTransit() {
    let data;
    try {
        const res = await fetch(METRO_PROXY_URL);
        if (!res.ok) { setStatus('metro: fetch error ' + res.status); return; }
        data = await res.json();
    } catch (err) { setStatus('metro: ' + err.message); return; }

    // Build line shapes on first poll
    if (!_metroShapes && data.shapes) {
        _metroShapes = data.shapes;
        buildMetroLineGeometry(data.shapes);
    }

    const incoming = data.vehicles || [];
    const seenIds = new Set();
    const now = performance.now();

    ensureMetroBatch();

    for (const v of incoming) {
        const id = v.id;
        seenIds.add(id);
        const lat     = v.lat;
        const lon     = v.lon;
        const bearing = v.bearing || 0;
        const color   = LINE_COLORS[v.color] || [0.9, 0.65, 0.1];

        if (_vehicles.has(id)) {
            const entry = _vehicles.get(id);
            entry.fromLat   = entry.displayLat;
            entry.fromLon   = entry.displayLon;
            entry.toLat     = lat;
            entry.toLon     = lon;
            entry.bearing   = bearing;
            entry.lerpStart = now;
            entry.color     = color;
        } else {
            // Assign a batch slot
            let slot = _metroSlotMap.size;
            _metroSlotMap.set(id, slot);
            // Set color in batch
            const colArr = _metroBatch.geometry.getAttribute('color').array;
            colArr[slot * 3]     = color[0];
            colArr[slot * 3 + 1] = color[1];
            colArr[slot * 3 + 2] = color[2];
            _metroBatch.geometry.getAttribute('color').needsUpdate = true;

            _vehicles.set(id, {
                slot,
                fromLat: lat, fromLon: lon,
                toLat: lat,   toLon: lon,
                displayLat: lat, displayLon: lon,
                bearing,
                lerpStart: now,
                color,
            });
        }
    }

    // Remove vehicles that disappeared
    for (const [id, entry] of _vehicles.entries()) {
        if (!seenIds.has(id)) {
            // Hide the slot
            const posArr = _metroBatch.geometry.getAttribute('position').array;
            posArr[entry.slot * 3 + 1] = -9999;
            _vehicles.delete(id);
            _metroSlotMap.delete(id);
        }
    }

    // Update draw range
    _metroBatch.geometry.setDrawRange(0, Math.max(...[..._metroSlotMap.values()]) + 1 || 0);
    _metroBatch.geometry.getAttribute('position').needsUpdate = true;

    _vehicleCount = _vehicles.size;
    updateHud();
}

function updateHud() {
    const cityNamePart = hudEl.dataset.cityName || '';
    const buildingPart = hudEl.dataset.buildings || '';
    let text = '';
    if (buildingPart) {
        text = '<span>' + buildingPart + '</span> buildings';
        if (cityNamePart) text += ' | ' + cityNamePart;
    }
    if (_transitActive) {
        text += (text ? ' | ' : '') + '<span>' + _vehicleCount.toLocaleString() + '</span> metro';
    }
    if (_aircraftActive) {
        text += (text ? ' | ' : '') + '<span>' + _aircraftCount.toLocaleString() + '</span> aircraft';
    }
    hudEl.innerHTML = text;
}

function startTransit() {
    if (_transitActive) return;
    _transitActive = true;
    transitBtn.classList.add('active');
    pollTransit();
    _transitTimer = setInterval(pollTransit, TRANSIT_POLL_MS);
}

function stopTransit() {
    if (!_transitActive && _transitTimer === null) return;
    _transitActive = false;
    if (_transitTimer !== null) { clearInterval(_transitTimer); _transitTimer = null; }
    disposeAllVehicles();
    disposeMetroLines();
    _metroShapes = null;
    transitBtn.classList.remove('active');
    updateHud();
}

function lerpVehicles() {
    if (!_metroBatch) return;
    const now = performance.now();
    const duration = TRANSIT_POLL_MS;
    const posArr = _metroBatch.geometry.getAttribute('position').array;

    for (const entry of _vehicles.values()) {
        const elapsed = now - entry.lerpStart;
        const rawT = Math.min(1, elapsed / duration);
        const t = 1 - (1 - rawT) * (1 - rawT); // ease-out

        const lat = entry.fromLat + (entry.toLat - entry.fromLat) * t;
        const lon = entry.fromLon + (entry.toLon - entry.fromLon) * t;
        entry.displayLat = lat;
        entry.displayLon = lon;

        const wPos = latLonToWorld(lat, lon);
        const i = entry.slot * 3;
        posArr[i]     = wPos.x;
        posArr[i + 1] = CROSS_Y;
        posArr[i + 2] = wPos.z;
    }

    _metroBatch.geometry.getAttribute('position').needsUpdate = true;
}

// ─── Utilities ────────────────────────────────────────────────────────────────

function setStatus(msg) {
    statusEl.textContent = msg;
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ─── Event handlers ──────────────────────────────────────────────────────────

loadBtn.addEventListener('click', () => {
    const q = inputEl.value.trim();
    if (q) loadCity(q);
});

inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        const q = inputEl.value.trim();
        if (q) loadCity(q);
    }
});

transitBtn.addEventListener('click', () => {
    if (!_cityBbox) { setStatus('load a city first'); return; }
    if (_transitActive) stopTransit(); else startTransit();
});

// ─── Aircraft layer ──────────────────────────────────────────────────────────

async function pollAircraft() {
    // radius: half the diagonal of the city bbox in degrees, min 1.0
    const { south, west, north, east } = _cityBbox;
    const radius = Math.max(1.0, Math.sqrt((north - south) ** 2 + (east - west) ** 2) / 2 * 1.5);
    // adsb.lol takes distance in nautical miles; convert from degrees
    const distNM = Math.max(50, radius * 60);
    const url = `https://api.adsb.lol/v2/lat/${originLat.toFixed(4)}/lon/${originLon.toFixed(4)}/dist/${Math.round(distNM)}`;

    let data;
    try {
        const res = await fetch(url);
        if (!res.ok) { setStatus('aircraft: fetch error ' + res.status); return; }
        data = await res.json();
    } catch (err) { setStatus('aircraft: ' + err.message); return; }

    // adsb.lol returns { ac: [ { lat, lon, alt_baro, gs, track, ... }, ... ] }
    const aircraft = data.ac || [];

    // Dispose old geometry
    if (_aircraftPoints) {
        scene.remove(_aircraftPoints);
        _aircraftPoints.geometry.dispose();
        _aircraftPoints.material.dispose();
        _aircraftPoints = null;
    }

    if (aircraft.length === 0) { _aircraftCount = 0; updateHud(); return; }

    // Each aircraft = diamond shape: center + 4 arms (forward/back longer, sides shorter)
    const FORWARD = 12; // world units along heading
    const SIDE    = 5;

    const positions = [];
    const colors    = [];

    for (const a of aircraft) {
        const lon      = a.lon;
        const lat      = a.lat;
        const altFt    = a.alt_baro;           // feet, or "ground"
        const onGround = altFt === 'ground';
        const altM     = onGround ? 0 : (typeof altFt === 'number' ? altFt * 0.3048 : 0);
        const heading  = a.track || a.true_heading || 0;

        if (lat == null || lon == null) continue;

        const wPos  = latLonToWorld(lat, lon);
        const altW  = onGround ? 2 : Math.max(2, altM * worldScale);

        const hr    = heading * Math.PI / 180;
        const fx    = Math.sin(hr);
        const fz    = -Math.cos(hr);
        const rx    = Math.cos(hr);
        const rz    = Math.sin(hr);

        // center
        positions.push(wPos.x, altW, wPos.z);
        // nose
        positions.push(wPos.x + fx * FORWARD, altW, wPos.z + fz * FORWARD);
        // tail
        positions.push(wPos.x - fx * (FORWARD * 0.6), altW, wPos.z - fz * FORWARD * 0.6);
        // left wing
        positions.push(wPos.x - rx * SIDE, altW, wPos.z - rz * SIDE);
        // right wing
        positions.push(wPos.x + rx * SIDE, altW, wPos.z + rz * SIDE);

        // Color: airborne = bright white-blue, on ground = dim amber
        const r = onGround ? 0.8 : 0.85;
        const g = onGround ? 0.6 : 0.95;
        const b = onGround ? 0.2 : 1.0;
        for (let i = 0; i < 5; i++) colors.push(r, g, b);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color',    new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({ size: 6, sizeAttenuation: true, vertexColors: true });
    _aircraftPoints = new THREE.Points(geo, mat);
    scene.add(_aircraftPoints);

    _aircraftCount = aircraft.filter(a => a.lat != null).length;
    updateHud();
}

function startAircraft() {
    if (_aircraftActive) return;
    _aircraftActive = true;
    aircraftBtn.classList.add('active');
    pollAircraft();
    _aircraftTimer = setInterval(pollAircraft, AIRCRAFT_POLL_MS);
}

function stopAircraft() {
    if (!_aircraftActive && _aircraftTimer === null) return;
    _aircraftActive = false;
    if (_aircraftTimer !== null) { clearInterval(_aircraftTimer); _aircraftTimer = null; }
    if (_aircraftPoints) {
        scene.remove(_aircraftPoints);
        _aircraftPoints.geometry.dispose();
        _aircraftPoints.material.dispose();
        _aircraftPoints = null;
    }
    _aircraftCount = 0;
    aircraftBtn.classList.remove('active');
    updateHud();
}

aircraftBtn.addEventListener('click', () => {
    if (!_cityBbox) { setStatus('load a city first'); return; }
    if (_aircraftActive) stopAircraft(); else startAircraft();
});

// ─── Animation loop ──────────────────────────────────────────────────────────

function animate() {
    requestAnimationFrame(animate);
    controls.update();

    // advance one chunk per frame to keep UI responsive
    if (_isBuildingChunks) {
        tickBuildChunks(_pendingCityName);
    }

    // smoothly interpolate metro vehicles between polls
    if (_transitActive && _vehicles.size > 0) {
        lerpVehicles();
    }

    // Animate ground wave so empty areas feel alive
    if (groundPoints && _groundOrigY) {
        _groundTime += 0.025;
        const posAttr  = groundPoints.geometry.getAttribute('position');
        const posArr   = posAttr.array;
        const colAttr  = groundPoints.geometry.getAttribute('color');
        const colArr   = colAttr.array;
        const count    = _groundOrigY.length;
        const citySpan = Math.max(_maxX - _minX, _maxZ - _minZ);
        const waveAmp  = citySpan * 0.003;  // amplitude scales with city size so it's never overwhelming
        const waveFreq = 6.0 / citySpan;    // frequency inversely proportional so large cities get broad waves

        for (let i = 0; i < count; i++) {
            const x    = posArr[i * 3];
            const z    = posArr[i * 3 + 2];
            const wave = Math.sin(x * waveFreq + _groundTime) * Math.cos(z * waveFreq * 0.7 + _groundTime * 0.8);
            posArr[i * 3 + 1] = _groundOrigY[i] + wave * waveAmp;

            // Pulse color with wave: bright peaks, dim troughs
            const brightness  = 0.5 + wave * 0.5;
            colArr[i * 3]     = 0.04 * brightness + 0.06 * Math.max(0, wave);
            colArr[i * 3 + 1] = 0.12 * brightness + 0.15 * Math.max(0, wave);
            colArr[i * 3 + 2] = 0.16 * brightness + 0.25 * Math.max(0, wave);
        }
        posAttr.needsUpdate = true;
        colAttr.needsUpdate = true;
    }

    composer.render();
}

// ─── Init ─────────────────────────────────────────────────────────────────────

initScene();
animate();

    </script>
