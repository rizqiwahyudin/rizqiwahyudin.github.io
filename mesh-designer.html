<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Gradient Designer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg: #0d0f0c;
            --glass-blur: 12px;
            --glass-tint: rgba(196, 169, 106, 0.08);
            --glass-wash: rgba(13, 15, 12, 0.7);
            --glass-border: rgba(196, 169, 106, 0.15);
            --text: #ddd5c0;
            --accent: #c4a96a;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .canvas-area {
            flex: 1;
            position: relative;
            background: #000;
        }
        
        #gradientCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .control-point {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: grab;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        
        .control-point:hover { transform: translate(-50%, -50%) scale(1.2); }
        .control-point.dragging { cursor: grabbing; }
        .control-point.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
        
        .panel {
            width: 320px;
            background: var(--glass-wash);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-left: 1px solid var(--glass-border);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
        
        .points-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .point-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        
        .point-row input[type="color"] {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }
        
        .point-row span { font-size: 12px; color: #888; }
        
        .point-row button {
            margin-left: auto;
            background: rgba(255,100,100,0.2);
            border: 1px solid rgba(255,100,100,0.3);
            color: #ff6666;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        button.primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        button.secondary {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .btn-row { display: flex; gap: 8px; }
        
        .grain-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .grain-controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .grain-controls input[type="range"] {
            width: 100%;
        }
        
        .grain-controls input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }
        
        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 6px;
            resize: vertical;
        }
        
        .nav { padding: 16px 20px; border-bottom: 1px solid var(--glass-border); }
        .nav a { color: var(--accent); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html">← Back to Portfolio</a>
    </nav>
    <div class="container">
        <div class="canvas-area" id="canvasArea">
            <canvas id="gradientCanvas"></canvas>
        </div>
        <div class="panel">
            <div>
                <h2>Control Points</h2>
                <div class="points-list" id="pointsList"></div>
                <div class="btn-row" style="margin-top: 12px;">
                    <button class="secondary" onclick="addPoint()">+ Add Point</button>
                    <button class="secondary" onclick="loadPreset()">Load Palette</button>
                </div>
            </div>
            
            <div>
                <h2>Grain</h2>
                <div class="grain-controls">
                    <label>
                        <input type="checkbox" id="grainEnabled" onchange="render()">
                        Enable Grain
                    </label>
                    <label>
                        Intensity
                        <input type="range" id="grainIntensity" min="0" max="100" value="30" oninput="render()">
                    </label>
                    <label>
                        <input type="checkbox" id="grainAnimated" onchange="render()">
                        Animated
                    </label>
                </div>
            </div>
            
            <div>
                <h2>Export</h2>
                <div class="btn-row">
                    <button class="primary" onclick="exportGLSL()">Copy GLSL</button>
                    <button class="secondary" onclick="exportJSON()">Copy JSON</button>
                </div>
                <textarea id="exportArea" placeholder="Exported code will appear here..."></textarea>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gradientCanvas');
        const ctx = canvas.getContext('2d');
        const canvasArea = document.getElementById('canvasArea');
        
        let points = [
            { x: 0.2, y: 0.2, color: '#1a1510' },
            { x: 0.8, y: 0.2, color: '#2a2215' },
            { x: 0.5, y: 0.5, color: '#3d2f1f' },
            { x: 0.2, y: 0.8, color: '#4a3825' },
            { x: 0.8, y: 0.8, color: '#c4a96a' }
        ];
        
        let selectedPoint = null;
        let dragging = false;
        let time = 0;
        
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1,3), 16) / 255;
            const g = parseInt(hex.slice(3,5), 16) / 255;
            const b = parseInt(hex.slice(5,7), 16) / 255;
            return { r, g, b };
        }
        
        function resize() {
            const rect = canvasArea.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            render();
        }
        
        function render() {
            const w = canvas.width;
            const h = canvas.height;
            
            // Clear
            ctx.fillStyle = '#0d0f0c';
            ctx.fillRect(0, 0, w, h);
            
            // Draw mesh gradient using radial gradients
            points.forEach(pt => {
                const x = pt.x * w;
                const y = pt.y * h;
                const radius = Math.max(w, h) * 0.8;
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                const rgb = hexToRgb(pt.color);
                gradient.addColorStop(0, `rgba(${Math.round(rgb.r*255)},${Math.round(rgb.g*255)},${Math.round(rgb.b*255)},1)`);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
            });
            
            // Grain
            if (document.getElementById('grainEnabled').checked) {
                const intensity = parseInt(document.getElementById('grainIntensity').value) / 255;
                const animated = document.getElementById('grainAnimated').checked;
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * intensity;
                    data[i] = Math.min(255, Math.max(0, data[i] + noise * 255));
                    data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise * 255));
                    data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise * 255));
                }
                
                ctx.putImageData(imageData, 0, 0);
            }
            
            // Draw control points
            drawControlPoints();
        }
        
        function drawControlPoints() {
            points.forEach((pt, i) => {
                const x = pt.x * canvas.width;
                const y = pt.y * canvas.height;
                
                const el = document.createElement('div');
                el.className = 'control-point' + (selectedPoint === i ? ' selected' : '');
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.background = pt.color;
                
                // Remove old points
                const existing = canvasArea.querySelectorAll('.control-point');
                existing.forEach(e => e.remove());
                
                canvasArea.appendChild(el);
            });
        }
        
        canvasArea.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('control-point')) {
                const idx = Array.from(e.target.parentNode.querySelectorAll('.control-point')).indexOf(e.target);
                selectedPoint = idx;
                dragging = true;
                render();
            }
        });
        
        canvasArea.addEventListener('mousemove', (e) => {
            if (dragging && selectedPoint !== null) {
                const rect = canvasArea.getBoundingClientRect();
                points[selectedPoint].x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                points[selectedPoint].y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
                updatePointsList();
                render();
            }
        });
        
        canvasArea.addEventListener('mouseup', () => {
            dragging = false;
        });
        
        canvasArea.addEventListener('mouseleave', () => {
            dragging = false;
        });
        
        function updatePointsList() {
            const list = document.getElementById('pointsList');
            list.innerHTML = points.map((pt, i) => `
                <div class="point-row">
                    <input type="color" value="${pt.color}" onchange="updatePointColor(${i}, this.value)">
                    <span>P${i+1}</span>
                    <button onclick="removePoint(${i})" ${points.length <= 2 ? 'disabled' : ''}>×</button>
                </div>
            `).join('');
        }
        
        function updatePointColor(i, color) {
            points[i].color = color;
            render();
        }
        
        function addPoint() {
            if (points.length >= 8) return;
            points.push({ x: 0.5, y: 0.5, color: '#888888' });
            updatePointsList();
            render();
        }
        
        function removePoint(i) {
            if (points.length <= 2) return;
            points.splice(i, 1);
            if (selectedPoint >= points.length) selectedPoint = points.length - 1;
            updatePointsList();
            render();
        }
        
        function loadPreset() {
            points = [
                { x: 0.1, y: 0.1, color: '#0d0f0c' },
                { x: 0.9, y: 0.1, color: '#1a1510' },
                { x: 0.5, y: 0.5, color: '#2a2215' },
                { x: 0.1, y: 0.9, color: '#4a3825' },
                { x: 0.9, y: 0.9, color: '#c4a96a' }
            ];
            updatePointsList();
            render();
        }
        
        function exportGLSL() {
            const uniforms = [];
            const colors = points.map(pt => {
                const rgb = hexToRgb(pt.color);
                return `vec3(${rgb.r.toFixed(3)}, ${rgb.g.toFixed(3)}, ${rgb.b.toFixed(3)})`;
            });
            
            const positions = points.map(pt => `vec2(${pt.x.toFixed(3)}, ${pt.y.toFixed(3)})`);
            
            const grainEnabled = document.getElementById('grainEnabled').checked;
            const grainIntensity = parseInt(document.getElementById('grainIntensity').value) / 100;
            const grainAnimated = document.getElementById('grainAnimated').checked;
            
            let grainCode = '';
            if (grainEnabled) {
                grainCode = `
    float grain = (fract(sin(dot(uv, vec2(12.9898, 78.233)${grainAnimated ? ' + uTime' : ''})) * 43758.5453) - 0.5) * ${grainIntensity.toFixed(2)};
    color += grain;`;
            }
            
            const shader = `// Mesh Gradient Shader for React Native Skia
// Copy into your Lace project

uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uRotation; // x: rotationX, y: rotationY from gyroscope

const int NUM_POINTS = ${points.length};

vec3 pointColors[NUM_POINTS] = vec3[](
${colors.map(c => '    ' + c).join(',\n')}
);

vec2 pointPositions[NUM_POINTS] = vec2[](
${positions.map(p => '    ' + p).join(',\n')}
);

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main(vec2 fragCoord) {
    vec2 uv = fragCoord / uResolution;
    
    // Apply gyroscope influence to UV
    uv += uRotation * 0.1;
    
    vec3 color = vec3(0.0);
    float totalWeight = 0.0;
    
    for (int i = 0; i < NUM_POINTS; i++) {
        float dist = distance(uv, pointPositions[i]);
        float weight = 1.0 / (1.0 + dist * 2.0);
        color += pointColors[i] * weight;
        totalWeight += weight;
    }
    
    color /= totalWeight;${grainCode}
    
    sk_FragColor = vec4(color, 1.0);
}`;
            
            document.getElementById('exportArea').value = shader;
            navigator.clipboard.writeText(shader);
        }
        
        function exportJSON() {
            const data = {
                points: points,
                grain: {
                    enabled: document.getElementById('grainEnabled').checked,
                    intensity: parseInt(document.getElementById('grainIntensity').value) / 100,
                    animated: document.getElementById('grainAnimated').checked
                }
            };
            const json = JSON.stringify(data, null, 2);
            document.getElementById('exportArea').value = json;
            navigator.clipboard.writeText(json);
        }
        
        window.addEventListener('resize', resize);
        updatePointsList();
        resize();
    </script>
</body>
</html>
