name: Oslo transit schedule

on:
  schedule:
    # Four times a day so the service-date file stays current through midnight Oslo.
    - cron: '20 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/oslo-transit/**'
      - '.github/workflows/oslo-schedule.yml'

permissions:
  contents: write

concurrency:
  group: oslo-schedule
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build compact Ruter schedule
        run: node workers/oslo-transit/build-schedule.mjs

      - name: Commit if the timetable changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oslo-schedule.json
          if git diff --staged --quiet; then
            echo 'schedule unchanged'
            exit 0
          fi
          git commit -m "Refresh Oslo Ruter transit schedule"
          git push
